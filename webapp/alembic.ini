# Alembic config. The database URL is NOT set here — migrations/env.py reads it
# from app.config.DB_URL (the DATABASE_URL env var), so it always matches the app.

[alembic]
script_location = migrations
prepend_sys_path = .
# Use os.pathsep-separated version paths; default single dir is fine.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
